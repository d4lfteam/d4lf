[project]
name = "d4lf"
requires-python = ">=3.15"
dependencies = [
  "beautifultable",
  "colorama",
  "httpx",
  "lxml",
  "mss",
  "natsort",
  "numpy",
  "opencv-python",
  "pillow",
  "psutil",
  "pydantic",
  "pydantic-numpy",
  "pynput",
  "pyqt6",
  "python-jsonpath",
  "pytweening",
  "pywin32; sys_platform == 'win32'",
  "pyyaml",
  "rapidfuzz",
  "requests",
  "ruamel-yaml",
  "selenium",
]
dynamic = ["version"]

[dependency-groups]
dev = [
  "lxml-stubs",
  "pyinstaller",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-xdist",
  "ruff",
  "ty",
  "types-psutil",
  "types-pywin32",
  "typing-extensions",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.version]
path = "src/__init__.py"

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = true

[tool.ruff.lint]
ignore = [
  "S101",  # assert, fix more in the future
  "FBT002",  # boolean-default-value-positional-argument
  "FBT001",  # boolean-type-hint-positional-argument
  "ERA001",  # commented-out-code, fix more in the future
  "C901",  # complex-structure, fix more in the future
  "TRY400",  # error-instead-of-exception, fix more in the future
  "LOG014",  # exc-info-outside-except-handler
  "FIX004",  # line-contains-hack, fix more in the future
  "FIX002",  # line-contains-todo, fix more in the future
  "E501",  # line-too-long
  "G004",  # logging-f-string
  "CPY001",  # missing-copyright-notice
  "TD002",  # missing-todo-author, fix more in the future
  "TD004",  # missing-todo-colon, fix more in the future
  "TD003",  # missing-todo-link, fix more in the future
  "COM812",  # missing-trailing-comma
  "T201",  # print, fix more in the future
  "SLF001",  # private-member-access, fix more in the future
  "TRY003",  # raise-vanilla-args, fix more in the future
  "TRY002",  # raise-vanilla-class, fix more in the future
  "PLR1704",  # redefined-argument-from-local, fix more in the future
  "PLR0913",  # too-many-arguments
  "PLR0912",  # too-many-branches, fix more in the future
  "PLR0917",  # too-many-positional-arguments
  "PLR0911",  # too-many-return-statements, fix more in the future
  "PLR0915",  # too-many-statements, fix more in the future
  "TRY004",  # type-check-without-type-error, fix more in the future
  "D105",  # undocumented-magic-method
  "D101",  # undocumented-public-class
  "D103",  # undocumented-public-function
  "D107",  # undocumented-public-init
  "D102",  # undocumented-public-method
  "D100",  # undocumented-public-module
  "D106",  # undocumented-public-nested-class
  "D104",  # undocumented-public-package
  "ARG001",  # unused-function-argument, fix more in the future
  "ARG002",  # unused-method-argument, fix more in the future
]
select = ["ALL"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",  # assert
  "FBT003",  # boolean-positional-value-in-call
  "PLR2004",  # magic-value-comparison
  "ANN202",  # missing-return-type-private-function
  "ANN204",  # missing-return-type-special-method
  "ANN205",  # missing-return-type-static-method
  "ANN201",  # missing-return-type-undocumented-public-function
  "ANN002",  # missing-type-args
  "ANN001",  # missing-type-function-argument
  "ANN003",  # missing-type-kwargs
  "SLF001",  # private-member-access
  "S311",  # suspicious-non-cryptographic-random-usage
]
"build.py" = [
  "S603",  # subprocess-without-shell-equals-true
]
"src/settings/controls.py" = [
  "S603",  # subprocess-without-shell-equals-true
]
"src/paragon/__init__.py" = [
  "PLC0415",  # import-outside-top-level
  "F822",  # undefined-export
]
"src/paragon/_*.py" = [
  "F403",  # undefined-local-with-import-star
  "F405",  # undefined-local-with-import-star-usage
]
"src/paragon/_shared.py" = ["ANN401", "F401"]  # any-type, unused-import

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.environment]
python-platform = "win32"
python-version = "3.15"

[tool.ty.rules]
all = "error"
